name: repo-check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'schema/**'
      - 'scripts/**'
      - 'tests/**'
      - '**/*.md'
      - 'llms.txt'
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'   # 外链每日查，不阻塞 PR
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Invariants
        run: python scripts/check_repo.py --root . --json
      - name: Generated artifacts are up to date
        run: python scripts/generate.py --root . --check

  positive-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Inject 8 known drifts
        run: python scripts/drift_probe.py --root .

  sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Generate SARIF
        run: python scripts/check_repo.py --root . --format sarif > repo-kit.sarif || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: repo-kit.sarif

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --include-fragments --no-progress
            'docs/**/*.md' 'examples/**/*.md' 'README.md' 'AGENTS.md' 'llms.txt'
          fail: true

  external-links:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments '**/*.md' 'llms.txt'
          fail: false
      - name: Open issue on external link failures
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated
