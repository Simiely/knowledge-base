name: repo-check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'schema/**'
      - 'tools/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'DEVELOPMENT.md'
      - 'CHANGELOG.md'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Doc dependencies
        # 文档检查的依赖与仓库自身 requirements.txt（运行/构建）解耦：
        # 代码仓库的 requirements.txt 往往只有打包工具，按它装会缺这三个包。
        run: python -m pip install "PyYAML>=6.0" "markdown-it-py>=3.0" "jsonschema>=4.20"
      - name: Invariants (link-only)
        run: python tools/repo-kit/check_repo.py --root .
      - name: Kit lock
        run: pwsh tools/update-repo-kit.ps1 -Check
